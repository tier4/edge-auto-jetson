# Workflow: create-base-anvil-image
# Purpose: This workflow creates a base Docker image for the Anvil Orin.
# It builds on top of a NVIDIA Jetpack base image and adds ROS Humble.
# The resulting image is pushed to GitHub Container Registry (ghcr.io).

name: create-base-anvil-image

# Trigger configuration
on:
  # Manual trigger only. Optionally specify which branch/tag to build (git-ref)
  # and the desired image tag (image-tag, sanitized to a valid Docker reference).
  workflow_dispatch:
    inputs:
      git-ref:
        description: Branch or tag to check out and build. Defaults to the ref this workflow run was started from.
        type: string
        required: false
      image-tag:
        description: The image tag to publish (sanitized to a valid Docker reference, e.g. "/" becomes "-").
        type: string
        required: true
      update-latest:
        description: Update "latest" reference
        type: boolean
        required: false
        default: false

# Global environment variables
env:
  # ROS distribution to install
  ROS_DISTRO: jazzy
  # Base Base Anvil Orin image to build upon (from TIER IV)
  BASE_IMAGE: ghcr.io/tier4/ota-base-image/esg620_nvidia-jetpack:r36.4.0-V002-cti_orin-agx_forge_base-v1

jobs:
  create-base-image:
    # Using ARM-based runner for compatibility with target architecture
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set env
        run: |
          echo "WORKSPACE_ROOT=$(pwd)" >> $GITHUB_ENV
          echo "CREATE_DATE=$(date +'%Y%m%d_%H%M(%Z)')" >> $GITHUB_ENV
      - name: Set tag name
        id: set-tag-name
        run: |
          if [ -n "${{ github.event.inputs.git-ref }}" ]; then
            REF_NAME="${{ github.event.inputs.git-ref }}"
          else
            REF_NAME="${{ github.ref_name }}"
          fi

          # Sanitize the requested image tag into a valid Docker tag:
          # replace disallowed characters with "-", strip any leading "-"/".",
          # and truncate to Docker's 128-char tag limit.
          RAW_TAG="${{ github.event.inputs.image-tag }}"
          TAG_NAME=$(echo "$RAW_TAG" | sed -E 's/[^a-zA-Z0-9_.-]/-/g; s/^[-.]+//' | cut -c1-128)
          if [ -z "$TAG_NAME" ]; then
            echo "::error::Sanitized tag derived from image-tag '$RAW_TAG' is empty"
            exit 1
          fi

          TAGS="ghcr.io/${{ github.repository }}/base-image:$TAG_NAME"
          if [ "${{ github.event.inputs.update-latest }}" = "true" ]; then
            TAGS="$(printf '%s\n%s' "$TAGS" "ghcr.io/${{ github.repository }}/base-image:latest")"
          fi

          echo "ref-name=$REF_NAME" >> $GITHUB_OUTPUT
          echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: set description
        id: set-description
        run: |
          echo "img-description=${{ env.CREATE_DATE }}, ros-${{ env.ROS_DISTRO }}-base" >> $GITHUB_OUTPUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.set-tag-name.outputs.ref-name }}

      - name: Set target name for beta branches
        id: set-target-name
        run: |
          if [[ "${{ steps.set-tag-name.outputs.ref-name }}" =~ "beta/" ]]; then
            echo "target-name=${{ steps.set-tag-name.outputs.ref-name }}" >> $GITHUB_OUTPUT
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          logout: false
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          file: docker/edge-auto/Dockerfile.bi
          set: |
            *.context=${{ env.WORKSPACE_ROOT }}
          tags: ${{ steps.set-tag-name.outputs.tags }}
          build-args: |
            DESCRIPTION=${{ steps.set-description.outputs.img-description }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            ROS_DISTRO=${{ env.ROS_DISTRO }}
