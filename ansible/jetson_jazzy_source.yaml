# Minimal playbook to run ros2_source_build on localhost (e.g. Jetson Ubuntu 22.04).
# Usage (from repo root or ansible/):
#   ansible-playbook -i localhost, ansible/jetson_jazzy_source.yaml -K
# Or from ansible/:
#   ansible-playbook -i localhost, jetson_jazzy_source.yaml

---
- name: Build ROS 2 Jazzy from source (Jetson Ubuntu 22.04)
  hosts: localhost
  connection: local
  roles:
    - role: ros2_source_build
