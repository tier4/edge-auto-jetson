### Build local stuffs
- name: Create Autoware directory
  ansible.builtin.file:
    path: "{{ perception_application_base_path }}"
    state: directory
    mode: "0755"

- name: Clone repository that contain install script
  ansible.builtin.set_fact:
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

- name: Clone edge-auto-jetson repository
  ansible.builtin.git:
    repo: "{{ perception_application_edge_auto_repo }}"
    dest: "{{ perception_application_base_path }}/{{ perception_application_directory_name }}"
    version: "{{ perception_application_edge_auto_version }}"
  environment:
    GITHUB_TOKEN: "{{ github_token }}"

- name: Create src directory
  ansible.builtin.file:
    path: "{{ perception_application_base_path }}/{{ perception_application_directory_name }}/src"
    state: directory
    mode: "0755"

- name: Import VCS repositories
  ansible.builtin.shell:
    cmd: vcs import src < autoware.repos
    chdir: "{{ perception_application_base_path }}/{{ perception_application_directory_name }}"
  changed_when: false
  environment:
    GITHUB_TOKEN: "{{ github_token }}"

- name: Clone missing dependencies
  ansible.builtin.shell:
    cmd: |
      if [ ! -d "src/lidartag_msgs" ]; then
        git clone -b tier4/universe https://github.com/tier4/lidartag_msgs.git src/lidartag_msgs || echo "Failed to clone lidartag_msgs, but continuing"
      fi

      if [ ! -d "src/mussp" ]; then
        git clone -b tier4/main https://github.com/tier4/mussp.git src/mussp || echo "Failed to clone mussp, but continuing"
      fi

      if [ ! -d "src/tier4_ad_api_adaptor" ]; then
        git clone -b 0.41.0 https://github.com/tier4/tier4_ad_api_adaptor.git src/tier4_ad_api_adaptor || echo "Failed to clone tier4_ad_api_adaptor, but continuing"
      fi

      if [ ! -d "src/eagleye" ]; then
        git clone -b main-ros2 https://github.com/MapIV/eagleye.git src/eagleye || echo "Failed to clone eagleye, but continuing"
      fi
    chdir: "{{ perception_application_base_path }}/{{ perception_application_directory_name }}"
    executable: /bin/bash
  changed_when: false
  environment:
    GITHUB_TOKEN: "{{ github_token }}"

- name: Upgrade pyOpenSSL using pip
  ansible.builtin.pip:
    name: pyopenssl
    state: latest
    executable: pip3

# Source path will be common setup path if perception_application_native_built_ros not true
- name: Set Source Path for X86
  ansible.builtin.set_fact:
    perception_application_ros_source_path: "/opt/ros/humble/setup.bash"
  when: not perception_application_native_built_ros|bool

# Source path will be different if perception_application_native_built_ros true
- name: Set Source Path for ARM
  ansible.builtin.set_fact:
    perception_application_ros_source_path: "/opt/ros/humble/install/setup.bash"
  when: perception_application_native_built_ros|bool

- name: Create custom rosdep rules directory
  ansible.builtin.file:
    path: /etc/ros/rosdep/sources.list.d
    state: directory
    mode: "0755"
  become: true

- name: Create custom rosdep rules file
  ansible.builtin.copy:
    dest: /etc/ros/rosdep/sources.list.d/50-autoware-custom.yaml
    content: |
      yaml file:///etc/ros/rosdep/autoware_custom.yaml
    mode: "0644"
  become: true

- name: Create custom rosdep definitions
  ansible.builtin.copy:
    dest: /etc/ros/rosdep/autoware_custom.yaml
    content: |
      lidartag_msgs:
        ubuntu: []
      glog:
        ubuntu:
          apt: [libgoogle-glog-dev]
      mussp:
        ubuntu: []
      awapi_awiv_adapter:
        ubuntu: []
      ros2_numpy:
        ubuntu:
          pip: [ros2_numpy]
      eagleye_rt:
        ubuntu: []
    mode: "0644"
  become: true

- name: Update rosdep
  ansible.builtin.shell:
    cmd: rosdep update
    executable: /bin/bash
  changed_when: false

- name: Install system dependencies for Autoware
  ansible.builtin.apt:
    name:
      - libgoogle-glog-dev
      - ros-humble-geographic-msgs
      - python3-pip
    state: present
  become: true

- name: Install Python dependencies
  ansible.builtin.pip:
    name: ros2_numpy
    state: present
    executable: pip3

- name: Install ROS dependencies using rosdep
  ansible.builtin.shell:
    cmd: source {{ perception_application_ros_source_path }} && rosdep install -y --from-paths src --ignore-src --rosdistro humble
    chdir: "{{ perception_application_base_path }}/{{ perception_application_directory_name }}"
    executable: /bin/bash
  changed_when: false

- name: Build Edge Auto Jetson package
  ansible.builtin.shell:
    cmd: source {{ perception_application_ros_source_path }} && ./build.sh {{ perception_type }}
    chdir: "{{ perception_application_base_path }}/{{ perception_application_directory_name }}"
    executable: /bin/bash
  changed_when: false
