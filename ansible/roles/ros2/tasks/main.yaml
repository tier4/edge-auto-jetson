# sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
- name: Authorize ROS GPG key
  become: true
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ros/rosdistro/master/ros.key
    dest: /usr/share/keyrings/ros-archive-keyring.gpg
    mode: 644

- name: Save result of 'dpkg --print-architecture'
  ansible.builtin.command: dpkg --print-architecture
  register: ros2__deb_architecture
  changed_when: false

- name: Save result of 'source /etc/os-release && echo $UBUNTU_CODENAME'
  ansible.builtin.shell: bash -c 'source /etc/os-release && echo $UBUNTU_CODENAME'
  register: ros2__ubuntu_codename
  changed_when: false

# echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(source /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
- name: Add ROS 2 apt repository to source list
  become: true
  ansible.builtin.apt_repository:
    repo: deb [arch={{ ros2__deb_architecture.stdout }} signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu {{ ros2__ubuntu_codename.stdout }} main
    filename: ros2
    state: present
    update_cache: true

- name: Install dependencies for setting up apt sources
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - lsb-release
      - apt-utils
      - build-essential
      - cmake
      - git
      - libbullet-dev
      - libpython3-dev
      - python3-flake8
      - python3-pip
      - python3-numpy
      - python3-pytest-cov
      - python3-setuptools
      - python3-vcstool
      - python3-rosinstall-generator
      - libasio-dev
      - libtinyxml2-dev
      - libcunit1-dev
      - libpugixml-dev
      - libgeographic-dev
      - libgtest-dev
      - libcgal-dev
      - libfmt-dev
    update_cache: true

- name: Install pip packages
  ansible.builtin.pip:
    name:
      - argcomplete
      - flake8-blind-except
      - flake8-builtins
      - flake8-class-newline
      - flake8-comprehensions
      - flake8-deprecated
      - flake8-docstrings
      - flake8-import-order
      - flake8-quotes
      - pytest-repeat
      - pytest-rerunfailures
      - pytest
      - scikit-build
      - cmake==3.31.6
    extra_args: --upgrade --no-cache-dir
    become: true
- name: Install EmPy with specific version
  ansible.builtin.pip:
    name:
      - empy==3.3.4
    extra_args: --no-cache-dir
    become: true

- name: Install ros-{{ rosdistro + '-' + installation_type }}
  become: true
  ansible.builtin.apt:
    name: ros-{{ rosdistro }}-{{ installation_type }}
    state: latest
    update_cache: true

- name: Install rosdep
  become: true
  ansible.builtin.apt:
    name:
      - python3-rosdep
    state: latest
    update_cache: true

- name: Install colcon-common-extensions
  become: true
  ansible.builtin.apt:
    name:
      - python3-colcon-common-extensions
    state: latest
    update_cache: true

- name: Install rmw-cyclonedds-cpp
  become: true
  ansible.builtin.apt:
    name:
      - ros-{{ rosdistro }}-rmw-cyclonedds-cpp
    state: latest
    update_cache: true

- name: Add PATH to .bashrc
  ansible.builtin.lineinfile:
    dest: ~/.bashrc
    line: source /opt/ros/{{ rosdistro }}/setup.bash
    state: present
    create: true
    mode: 0644
