# ROS distro to build from source (e.g. jazzy for Ubuntu 22.04).
rosdistro: jazzy
ros_variant: ros_base  # detailed ros_variant is defined in https://www.ros.org/reps/rep-2001.html#jazzy-jalisco-may-2024-may-2029
# Workspace directory (src, build, log). Install goes to /opt/ros/{{ rosdistro }} via --install-base.
source_build_workspace_dir: "{{ ansible_env.HOME }}/source_builds_ws"

# Additional ROS packages imported with rosinstall_generator.
extra_rosinstall_packages:
  # - launch-xml #  already included in ros_base
  # - launch-yaml #  already included in ros_base
  # - launch-testing #  already included in ros_base
  # - launch-testing-ament-cmake #  already included in ros_base
  # - demo-nodes-cpp
  # - demo-nodes-py
  # - example-interfaces
  - camera-calibration-parsers
  - camera-info-manager
  - cv_bridge
  # - v4l2_camera # tier4/edge-auto-jetson already includes this
  - vision_opencv
  # - libstatistics-collector #already included in ros_base
  - geographic_msgs
  - vision_msgs
  - image_geometry
  # - image_pipeline # tier4/edge-auto-jetson already includes this
  - image-transport
  # - compressed_image_transport  # tier4/edge-auto-jetson already includes this
  # - compressed_depth_image_transport  # tier4/edge-auto-jetson already includes this
  - pcl_msgs
  - perception_pcl
  # - logging-demo
  - udp_msgs
  - angles
  - diagnostics
  - tf_transformations
  # - mrt_cmake_modules # tier4/edge-auto-jetson already includes this
  # - gtest-vendor # already included in ros_base
  - grid_map
  - filters
  - nav2_msgs
  # - tf2_ros # already included in ros_base
  # - tf2_eigen #  already included in ros_base
  # - ament_cmake_clang_format # maybe already included in ros_base
  # - rmw_cyclonedds_cpp # already included in ros_base

# Extra system libraries needed by the selected extra ROS packages.
extra_system_packages:
  - cmake # from https://github.com/tier4/edge-auto-jetson/blob/338f46f06400f1768b1f323b45425979b9cdc178/ansible/roles/ros2/tasks/main.yaml#L39-L61
  - libbullet-dev
  - libpython3-dev
  - python3-flake8
  - python3-pip
  - python3-numpy
  - python3-setuptools
  - python3-vcstool
  - python3-rosinstall-generator
  - libasio-dev
  - libtinyxml2-dev
  - libcunit1-dev
  - libpugixml-dev
  - libgeographic-dev
  - libgtest-dev
  - libcgal-dev
  - libfmt-dev
  - python3-rosdep # https://github.com/tier4/edge-auto-jetson/blob/338f46f06400f1768b1f323b45425979b9cdc178/ansible/roles/ros2/tasks/main.yaml#L133
  - python3-colcon-common-extensions
  - librange-v3-dev
  - v4l-utils
  - nlohmann-json3-dev

# Extra Python packages needed by the selected extra ROS packages.
extra_python_packages:
  - empy==3.3.4 # https://github.com/tier4/edge-auto-jetson/blob/338f46f06400f1768b1f323b45425979b9cdc178/ansible/roles/ros2/tasks/main.yaml#L63
  - argcomplete # # https://github.com/tier4/edge-auto-jetson/blob/338f46f06400f1768b1f323b45425979b9cdc178/ansible/roles/ros2/tasks/main.yaml#L69
  - pytest
  - pytest-repeat
  - pytest-rerunfailures
  - scikit-build
  - cmake==3.31.6
  - flake8-blind-except # https://github.com/tier4/edge-auto-jetson/blob/338f46f06400f1768b1f323b45425979b9cdc178/ansible/roles/ros2/tasks/main.yaml#L81
  - flake8-builtins
  - flake8-class-newline
  - flake8-comprehensions
  - flake8-deprecated
  - flake8-docstrings
  - flake8-import-order
  - flake8-quotes

# Generated rosinstall file for the selected extra ROS packages.
extra_rosinstall_file: "{{ source_build_workspace_dir }}/ros2.{{ rosdistro }}.extra.rosinstall"
